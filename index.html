<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotulador de Certificados | Club Atlas</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#eef1f5;
    color:#1f2937;
}

header{
    background:#111827;
    color:white;
    padding:18px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    font-size:22px;
}

header span{
    font-size:13px;
    color:#cbd5e1;
}

.app{
    display:grid;
    grid-template-columns:380px 1fr;
    min-height:calc(100vh - 68px);
}

.panel{
    background:white;
    padding:24px;
    border-right:1px solid #d1d5db;
    overflow:auto;
}

.panel h2{
    margin-top:0;
    font-size:18px;
}

.grupo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:14px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

.fila{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.separador{
    border-top:1px solid #e5e7eb;
    margin:22px 0;
}

.calibracion{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:15px;
    border-radius:8px;
}

.calibracion h3{
    margin-top:0;
    font-size:15px;
}

button{
    border:0;
    padding:12px 15px;
    border-radius:7px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-imprimir{
    width:100%;
    background:#166534;
    color:white;
    margin-top:12px;
}

.btn-imprimir:hover{
    background:#14532d;
}

.btn-guardar{
    width:100%;
    background:#1d4ed8;
    color:white;
    margin-top:10px;
}

.btn-reset{
    width:100%;
    background:#e5e7eb;
    margin-top:8px;
}

.preview-area{
    padding:30px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.preview-area h2{
    font-size:16px;
    margin-top:0;
}

.nota{
    font-size:12px;
    color:#64748b;
    margin-bottom:15px;
}

/*
 HOJA REAL:
 215 mm x 350 mm
*/
.hoja{
    position:relative;
    width:215mm;
    height:350mm;
    background:white;
    box-shadow:0 5px 25px rgba(0,0,0,.18);
    transform-origin:top center;
    transform:scale(.58);
    margin-bottom:-520px;
    overflow:hidden;
}

/*
 La imagen es únicamente una referencia visual.
 No se imprime.
*/
.certificado-fondo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    opacity:.55;
    pointer-events:none;
}

.texto-certificado{
    position:absolute;
    white-space:nowrap;
    font-family:"Times New Roman", serif;
    font-size:4mm;
    color:#000;
    z-index:10;
}

/* posiciones iniciales aproximadas */

#texto1{
    left:24mm;
    top:170mm;
}

#texto2{
    left:24mm;
    top:224mm;
}

#texto3{
    left:24mm;
    top:278mm;
}

#texto4{
    left:24mm;
    top:320mm;
}

#textoFecha{
    left:145mm;
    top:320mm;
}

.regla{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
    display:none;
    background-image:
        linear-gradient(to right, rgba(0,100,255,.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,100,255,.12) 1px, transparent 1px);
    background-size:10mm 10mm;
}

.mostrar-regla .regla{
    display:block;
}

@media(max-width:1000px){

    .app{
        grid-template-columns:1fr;
    }

    .panel{
        border-right:0;
    }

}

/* IMPRESIÓN */

@page{
    size:215mm 350mm;
    margin:0;
}

@media print{

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        width:215mm;
        height:350mm;
        background:white;
    }

    header,
    .panel,
    .preview-area > h2,
    .nota{
        display:none !important;
    }

    .app{
        display:block;
    }

    .preview-area{
        padding:0;
        margin:0;
        display:block;
    }

    .hoja{
        width:215mm;
        height:350mm;
        margin:0;
        padding:0;
        transform:none !important;
        box-shadow:none;
        overflow:hidden;
    }

    /*
    MUY IMPORTANTE:
    el certificado de fondo NO se imprime.
    */
    .certificado-fondo,
    .regla{
        display:none !important;
    }

    .texto-certificado{
        color:#000 !important;
    }

}

</style>
</head>

<body>

<header>

    <div>
        <h1>Rotulador de Certificados</h1>
        <span>Club Atlas · Sistema de impresión</span>
    </div>

    <div>
        Papel seguridad 215 × 350 mm
    </div>

</header>

<div class="app">

<section class="panel">

<h2>Datos del certificado</h2>

<div class="grupo">

<label>Sección / operación</label>

<select id="seccion">

<option value="principal">
Certificado principal
</option>

<option value="cesion1">
Cesión 1
</option>

<option value="cesion2">
Cesión 2
</option>

<option value="cesion3">
Cesión 3
</option>

</select>

</div>

<div class="grupo">

<label>Nombre 1</label>

<input
id="nombre1"
type="text"
placeholder="Escriba el primer nombre"
oninput="actualizar()">

</div>

<div class="grupo">

<label>Nombre 2</label>

<input
id="nombre2"
type="text"
placeholder="Escriba el segundo nombre"
oninput="actualizar()">

</div>

<div class="grupo">

<label>Nombre 3</label>

<input
id="nombre3"
type="text"
placeholder="Escriba el tercer nombre"
oninput="actualizar()">

</div>

<div class="grupo">

<label>Nombre 4</label>

<input
id="nombre4"
type="text"
placeholder="Escriba el cuarto nombre"
oninput="actualizar()">

</div>

<div class="grupo">

<label>Fecha</label>

<input
id="fecha"
type="date"
oninput="actualizar()">

</div>

<div class="separador"></div>

<div class="calibracion">

<h3>Calibración de impresión</h3>

<div class="grupo">

<label>Desplazamiento horizontal X (mm)</label>

<input
id="offsetX"
type="number"
step="0.5"
value="0"
oninput="aplicarCalibracion()">

</div>

<div class="grupo">

<label>Desplazamiento vertical Y (mm)</label>

<input
id="offsetY"
type="number"
step="0.5"
value="0"
oninput="aplicarCalibracion()">

</div>

<div class="grupo">

<label>Tamaño de letra (mm)</label>

<input
id="tamano"
type="number"
step="0.2"
value="4"
oninput="aplicarCalibracion()">

</div>

<div class="grupo">

<label>
<input
type="checkbox"
id="verRegla"
onchange="mostrarRegla()"
style="width:auto">
Mostrar cuadrícula de calibración
</label>

</div>

<button
class="btn-guardar"
onclick="guardarConfiguracion()">
Guardar calibración
</button>

<button
class="btn-reset"
onclick="restablecer()">
Restablecer
</button>

</div>

<button
class="btn-imprimir"
onclick="imprimir()">
🖨 Imprimir certificado
</button>

</section>


<section class="preview-area">

<h2>Vista previa</h2>

<div class="nota">
El certificado de fondo es únicamente una referencia.
No se imprimirá.
</div>

<div class="hoja" id="hoja">

<!--
Después cargaremos aquí la imagen real
del certificado dentro del repositorio.
-->

<img
id="fondo"
class="certificado-fondo"
src="certificado.jpg"
alt="Certificado">

<div class="regla"></div>

<div
class="texto-certificado"
id="texto1">
Nombre 1
</div>

<div
class="texto-certificado"
id="texto2">
Nombre 2
</div>

<div
class="texto-certificado"
id="texto3">
Nombre 3
</div>

<div
class="texto-certificado"
id="texto4">
Nombre 4
</div>

<div
class="texto-certificado"
id="textoFecha">
Fecha
</div>

</div>

</section>

</div>

<script>

const posicionesBase = {

    texto1:{
        x:24,
        y:170
    },

    texto2:{
        x:24,
        y:224
    },

    texto3:{
        x:24,
        y:278
    },

    texto4:{
        x:24,
        y:320
    },

    textoFecha:{
        x:145,
        y:320
    }

};


function actualizar(){

    document.getElementById("texto1").textContent =
    document.getElementById("nombre1").value || "Nombre 1";

    document.getElementById("texto2").textContent =
    document.getElementById("nombre2").value || "Nombre 2";

    document.getElementById("texto3").textContent =
    document.getElementById("nombre3").value || "Nombre 3";

    document.getElementById("texto4").textContent =
    document.getElementById("nombre4").value || "Nombre 4";


    const fecha =
    document.getElementById("fecha").value;

    if(fecha){

        const partes =
        fecha.split("-");

        document.getElementById("textoFecha").textContent =
        partes[2] + "/" +
        partes[1] + "/" +
        partes[0];

    }else{

        document.getElementById("textoFecha").textContent =
        "Fecha";

    }

}


function aplicarCalibracion(){

    const x =
    parseFloat(
        document.getElementById("offsetX").value
    ) || 0;

    const y =
    parseFloat(
        document.getElementById("offsetY").value
    ) || 0;

    const tamano =
    parseFloat(
        document.getElementById("tamano").value
    ) || 4;


    Object.keys(posicionesBase).forEach(id => {

        const elemento =
        document.getElementById(id);

        elemento.style.left =
        (posicionesBase[id].x + x) + "mm";

        elemento.style.top =
        (posicionesBase[id].y + y) + "mm";

        elemento.style.fontSize =
        tamano + "mm";

    });

}


function mostrarRegla(){

    const hoja =
    document.getElementById("hoja");

    if(
        document.getElementById("verRegla").checked
    ){

        hoja.classList.add(
            "mostrar-regla"
        );

    }else{

        hoja.classList.remove(
            "mostrar-regla"
        );

    }

}


function guardarConfiguracion(){

    const configuracion = {

        x:
        document.getElementById("offsetX").value,

        y:
        document.getElementById("offsetY").value,

        tamano:
        document.getElementById("tamano").value

    };

    localStorage.setItem(
        "atlasCalibracion",
        JSON.stringify(configuracion)
    );

    alert(
        "Calibración guardada correctamente."
    );

}


function cargarConfiguracion(){

    const guardada =
    localStorage.getItem(
        "atlasCalibracion"
    );

    if(!guardada){
        aplicarCalibracion();
        return;
    }

    const config =
    JSON.parse(guardada);

    document.getElementById(
        "offsetX"
    ).value = config.x || 0;

    document.getElementById(
        "offsetY"
    ).value = config.y || 0;

    document.getElementById(
        "tamano"
    ).value = config.tamano || 4;

    aplicarCalibracion();

}


function restablecer(){

    document.getElementById(
        "offsetX"
    ).value = 0;

    document.getElementById(
        "offsetY"
    ).value = 0;

    document.getElementById(
        "tamano"
    ).value = 4;

    aplicarCalibracion();

}


function imprimir(){

    aplicarCalibracion();

    window.print();

}


window.onload = function(){

    cargarConfiguracion();
    actualizar();

};

</script>

</body>
</html>
